# ============================================================
# 配置注释模板（示例）：每项的作用、取值范围与调法都写在这里。
#
# 使用方式：
#   - 本文件只是“说明书/模板”，程序不直接读取它；
#   - 实际生效的是同目录 config.yaml（网页“保存配置”会整份重写它，
#     因此不会保留注释，注释统一放在本文件）；
#   - 需要改参数时，可对照本文件在网页表单里改，或复制本文件为
#     config.yaml 后手动编辑。
#
# 规则：布尔值写 true/false；含冒号、#、空格的字符串加引号；
#       相对路径相对本文件目录；密码一律走环境变量，不写在这里。
# ============================================================

# ------------------------------------------------------------
# 摄像头采集（分辨率/帧率/码率/翻转改动属“需重启”项）
# ------------------------------------------------------------
camera:
  # 录像与快照主画面宽度（像素）。Zero W 建议 1280 以内；省空间可改 960/640
  main_width: 1280
  # 主画面高度（像素）。1280x720=720p，640x480=480p，注意保持比例
  main_height: 720
  # 录像帧率 fps，Zero W 建议 10~15，过高增加编码负担
  fps: 15
  # 移动检测专用低分辨率宽度（像素），只用于判断有没有动，不进录像
  lores_width: 320
  # 移动检测低分辨率高度（像素），越小越省 CPU，320x240 足够
  lores_height: 240
  # 垂直翻转（摄像头倒装设 true）。需重启
  vflip: false
  # 水平镜像（方向不对设 true）。需重启
  hflip: false
  # H.264 目标码率(bps)。720p15 用 3,000,000；省空间可降到 1,500,000。需重启
  bitrate: 3000000
  # 是否在录像画面左上角烧录时间戳（true 叠加白色时间，false 视频干净无文字）。需重启
  burn_timestamp: true
  # 时间戳格式（strftime），可改成 "%Y/%m/%d %H:%M:%S" 或加毫秒 "%H:%M:%S.%f"。需重启
  timestamp_format: "%Y-%m-%d %H:%M:%S"

# ------------------------------------------------------------
# 移动检测（网页保存后即时生效，无需重启）
# ------------------------------------------------------------
motion:
  # 是否启用移动检测；false 时不判定、不触发录像与快照
  enabled: true
  # 二值化阈值 0-255，越大越不灵敏。误报（树叶/光影）调高如 40，小目标漏检调低如 18
  sensitivity: 28
  # 低于该面积(lores 像素)的轮廓忽略，过滤噪点。误报调高，漏检调低
  min_area: 400
  # 高斯模糊核大小(奇数)，抑制噪点，一般 3/5/7
  blur_px: 5
  # 闭运算宽度(lores 像素)：横向桥接同一目标“旧位残影+新位”，消除成对细条框；移动快可调大
  close_width: 15
  # 闭运算高度(lores 像素)：纵向桥接范围，一般 5~9
  close_height: 7
  # 轮廓合并间距(lores 像素)：水平间距小于它的相邻框合并成一个；误合并两个目标就调小
  merge_gap: 60
  # 连续多少帧都检测到才算一次移动，防抖；越大越稳
  confirm_frames: 2
  # 是否在快照上画移动框（视频本体始终干净，不叠框）
  draw_boxes: true
  # 框颜色，BGR 顺序 [蓝,绿,红]，[0,255,0] 为绿色
  box_color:
    - 0
    - 255
    - 0
  # 框线粗细(像素)
  box_thickness: 2
  # 检测到移动时是否保存带框快照 JPEG
  snapshot_on_motion: true

# ------------------------------------------------------------
# 录像与本地留存（录制模式/目录改动需重启）
# ------------------------------------------------------------
recorder:
  # 录制模式：motion=移动触发才录像(省存储,推荐)；continuous=7x24 连续。需重启
  mode: motion
  # continuous 下每个分段时长(秒)，到点自动切新文件；motion 模式不用此项
  segment_seconds: 300
  # motion 下：最后一次移动后继续录多少秒再停，留住动作结尾
  post_motion_seconds: 12
  # 本地录像保存目录
  local_dir: ./recordings
  # 移动快照保存目录
  snapshot_dir: ./snapshots
  # 本地保留容量上限(GB)，超了自动删最旧；0=不自动清理
  max_local_gb: 5
  # 上传 SMB 成功后是否保留本地：true 保留，false 删除(只删已成功上传的)
  keep_local_after_upload: true

# ------------------------------------------------------------
# SMB 网络共享备份上传（主机/共享/账号改动需重启）
# ------------------------------------------------------------
smb:
  # 是否启用 SMB 上传；false 只存本地
  enabled: true
  # SMB 服务器地址(IP 或主机名)。需重启
  host: "192.168.1.10"
  # SMB 端口，默认 445，老设备可能 139。需重启
  port: 445
  # 共享名称(服务器上开放的文件夹名)，不是完整路径。需重启
  share: "surveillance"
  # 登录用户名，访客可填 guest。需重启
  username: "guest"
  # 密码读取自哪个环境变量名(密码不写这里)。需重启
  password_env: "SMB_PASSWORD"
  # 工作组/域，一般留空；加入域时填写。需重启
  domain: ""
  # 远端目录(相对共享根)，不存在会自动创建。需重启
  remote_dir: "/rpi-zero-01"
  # 上传失败重试间隔(秒)，断网期间在本地队列等待，恢复后自动补传
  retry_interval: 60
  # 是否同时上传移动快照；false 只传视频
  upload_snapshots: true

# ------------------------------------------------------------
# 电池亏电监测与邮件告警（阈值/轮询即时生效；后端类型需重启）
# ------------------------------------------------------------
battery:
  # 是否启用电池监测；false 不读电压不发低电邮件
  enabled: true
  # 电压读取后端：command=自定义命令(默认)；mcp3008=SPI ADC+分压；ina219=I2C 传感器。需重启
  backend: command
  # 电压轮询间隔(秒)
  poll_interval: 30
  # 低电压阈值(V)：低于它发“偏低提醒”；按电池类型/串数换算，单节锂电约 3.5
  low_threshold: 3.5
  # 严重低压阈值(V)：低于它发“紧急，请立即断电”，应低于 low_threshold，单节锂电约 3.3
  critical_threshold: 3.3
  # 同级告警冷却(秒)，避免电压抖动反复发信；1800=30 分钟内不重复发同级邮件
  alert_cooldown: 1800
  # backend=command 时：一条向 stdout 打印“一个浮点电压(单位 V)”的 shell 命令
  command: "cat /sys/class/power_supply/battery/voltage_now | awk '{printf \"%.3f\\n\", $1/1000000}'"
  # backend=mcp3008 时使用(command 模式忽略本段)
  mcp3008:
    # SPI 总线号 /dev/spidev<bus>.<device>
    bus: 0
    # SPI 设备号(片选)，CE0=0，CE1=1
    device: 0
    # 接电池的 ADC 通道 0~7
    channel: 0
    # ADC 参考电压，常见 3.3V
    vref: 3.3
    # 分压比=(上电阻+下电阻)/下电阻，按实际电路换算；1:1 等值分压填 2.0
    divider_ratio: 2.0
  # backend=ina219 时使用(I2C 电流/电压传感器，常见 UPS HAT；command 模式忽略)
  ina219:
    # I2C 总线号，Zero W 通常 1(/dev/i2c-1)
    i2c_bus: 1
    # INA219 I2C 地址，默认 0x40，可由 A0/A1 改址
    address: "0x40"

# ------------------------------------------------------------
# 邮件 SMTP 发信（账号/收件人网页保存即时生效；密码走环境变量）
# ------------------------------------------------------------
mail:
  # 是否启用邮件发送
  enabled: true
  # SMTP 服务器，如 QQ smtp.qq.com、163 smtp.163.com、Gmail smtp.gmail.com
  smtp_host: "smtp.example.com"
  # 端口：SSL 常用 465，STARTTLS 常用 587，二者只开一个
  smtp_port: 465
  # SSL 加密(配 465)，与 use_starttls 二选一
  use_ssl: true
  # STARTTLS 升级加密(配 587)，与 use_ssl 二选一
  use_starttls: false
  # 登录 SMTP 的账号(一般即发信邮箱)
  username: "alert@example.com"
  # 邮箱密码/授权码读取自哪个环境变量；多数邮箱用“授权码”而非登录密码。密码不写这里
  password_env: "MAIL_PASSWORD"
  # 发件人地址，一般与 username 相同
  sender: "alert@example.com"
  # 收件人列表，可写多个，每项一行
  recipients:
    - "owner@example.com"
  # 邮件主题前缀，便于在邮箱里筛选告警
  subject_prefix: "[RPi-Zero 监控]"

# ------------------------------------------------------------
# 内置网页面板（端口/地址改动需重启；预览参数即时生效）
# ------------------------------------------------------------
web:
  # 是否启用网页服务；false 只后台运行不开页面
  enabled: true
  # 监听地址：0.0.0.0=局域网可访问；127.0.0.1=仅本机。需重启
  host: "0.0.0.0"
  # 网页端口，访问 http://<树莓派IP>:端口。需重启
  port: 8080
  # 网页登录用户名
  username: "admin"
  # 网页密码读取自哪个环境变量名(密码不写这里)。需重启
  password_env: "WEB_PASSWORD"
  # MJPEG 预览流宽度(像素)，等比缩放；越小越流畅省带宽
  stream_width: 480
  # 预览帧率 fps，Zero W 建议 5~10
  stream_fps: 10
  # 预览 JPEG 质量 1~95，越低越省带宽，60 左右清晰且轻量
  jpeg_quality: 60

# ------------------------------------------------------------
# 系统项
# ------------------------------------------------------------
system:
  # 日志级别 DEBUG/INFO/WARNING/ERROR，日常 INFO
  log_level: INFO
  # SMB 上传队列持久化文件，重启后继续补传，一般不用改
  queue_file: ./upload_queue.json
